name: Release & Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release
        run: |
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm publish:verify

      # npm trusted publishing uses the workflow's OIDC identity. setup-node's
      # temporary token entry would otherwise override it with an empty value.
      - name: Prepare npm trusted publishing
        run: rm -f "$NPM_CONFIG_USERCONFIG"

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release:packages
          version: pnpm version:packages
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
