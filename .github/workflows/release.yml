name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      version-bump:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      dry-run:
        description: 'Perform a dry run without publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.x]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      
      - name: Install dependencies
        run: npm ci

      - name: Bump release version
        id: version
        run: |
          npm version "${{ inputs.version-bump }}" \
            --workspaces \
            --include-workspace-root \
            --no-git-tag-version

          VERSION=$(node -p "require('./package.json').version")
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
      
      - name: Run build
        run: npm run build
      
      - name: Run typecheck
        run: npm run typecheck
      
      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      
      - name: Validate package integrity
        run: |
          # Verify that key distribution files exist
          test -f packages/core/dist/index.mjs || exit 1
          test -f packages/core/dist/index.d.mts || exit 1
          test -f packages/compdi/dist/index.mjs || exit 1
          test -f packages/compdi/dist/index.d.mts || exit 1
          test -f packages/unplugin/dist/index.mjs || exit 1
          test -f packages/unplugin/dist/index.d.mts || exit 1
          echo "✓ All distribution files verified"

      - name: Commit release version
        if: ${{ inputs.dry-run == false }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          git add package.json package-lock.json packages/*/package.json playground/package.json
          git commit -m "chore: release v${VERSION}"
          git push origin HEAD:${{ github.ref_name }}
      
      - name: Publish to npm (Dry Run)
        if: ${{ inputs.dry-run == true }}
        run: npm run publish:dry-run
      
      - name: Publish to npm
        if: ${{ inputs.dry-run == false }}
        run: npm run publish:ci
      
      - name: Create Git tag
        if: ${{ inputs.dry-run == false }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
      
      - name: Create GitHub Release
        if: ${{ inputs.dry-run == false }}
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Release v${{ steps.version.outputs.value }}
          body: |
            ## Published Packages

            ### Public
            - @compdi/core@${{ steps.version.outputs.value }} - Type-safe DI macros
            - compdi@${{ steps.version.outputs.value }} - Unified public API
            - unplugin-compdi@${{ steps.version.outputs.value }} - Build plugin

            ## Links
            - npm: https://www.npmjs.com/package/compdi
            - scoped: https://www.npmjs.com/package/@compdi/core
            - plugin: https://www.npmjs.com/package/unplugin-compdi
          draft: false
          prerelease: false

  verify:
    needs: release
    if: ${{ inputs.dry-run == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Verify npm publication
        run: |
          VERSION=$(npm view compdi version)
          echo "✓ compdi@${VERSION} verified on npm"
          
          CORE_VERSION=$(npm view @compdi/core version)
          echo "✓ @compdi/core@${CORE_VERSION} verified on npm"

          UNPLUGIN_VERSION=$(npm view unplugin-compdi version)
          echo "✓ unplugin-compdi@${UNPLUGIN_VERSION} verified on npm"
