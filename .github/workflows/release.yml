name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      version-bump:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      dry-run:
        description: 'Perform a dry run without publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run build
        run: npm run build
      
      - name: Run typecheck
        run: npm run typecheck
      
      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      
      - name: Validate package integrity
        run: |
          # Verify that key distribution files exist
          test -f packages/core/dist/index.mjs || exit 1
          test -f packages/core/dist/index.d.mts || exit 1
          test -f packages/compdi/dist/index.mjs || exit 1
          test -f packages/compdi/dist/index.d.mts || exit 1
          echo "✓ All distribution files verified"
      
      - name: Publish to npm (Dry Run)
        if: ${{ inputs.dry-run == true }}
        run: |
          echo "📋 Dry Run Mode: Simulating publish..."
          echo "Would publish the following packages:"
          echo "  - @compdi/core (public)"
          echo "  - compdi (public)"
          echo "  - @compdi/shared (private, skipped)"
          echo "  - unplugin-compdi (private, skipped)"
      
      - name: Publish to npm
        if: ${{ inputs.dry-run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Publish only public packages
          npm publish --workspace packages/core --access public
          npm publish --workspace packages/compdi --access public
          echo "✓ Packages published successfully"
      
      - name: Create Git tag
        if: ${{ inputs.dry-run == false }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
      
      - name: Create GitHub Release
        if: ${{ inputs.dry-run == false }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: Release v${{ env.VERSION }}
          body: |
            ## Published Packages

            ### Public
            - @compdi/core@${{ env.VERSION }} - Type-safe DI macros
            - compdi@${{ env.VERSION }} - Unified public API

            ### Private (not published)
            - @compdi/shared@${{ env.VERSION }} - Internal utilities
            - unplugin-compdi@${{ env.VERSION }} - Build plugin

            ## Links
            - npm: https://www.npmjs.com/package/compdi
            - scoped: https://www.npmjs.com/package/@compdi/core
          draft: false
          prerelease: false

  verify:
    needs: release
    if: ${{ inputs.dry-run == false }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Verify npm publication
        run: |
          VERSION=$(npm view compdi version)
          echo "✓ compdi@${VERSION} verified on npm"
          
          CORE_VERSION=$(npm view @compdi/core version)
          echo "✓ @compdi/core@${CORE_VERSION} verified on npm"
